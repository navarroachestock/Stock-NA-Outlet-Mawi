<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stock Navarro Ache</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d1b18; --muted:#6f6a62; --line:#e4e0d8;
  --accent:#8a5a2b; --ok:#1f7a4a; --okbg:#e3f3ea; --warn:#9a5b00; --warnbg:#fdf0d9;
  --mid:#2f5f8a; --midbg:#e6eff8;
  --off:#8b8680; --offbg:#efede9; --chip:#ebe7df; --no:#c0392b; --nobg:#fbe6e3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151413; --card:#201f1d; --ink:#f1eee9; --muted:#a39d94; --line:#34312d;
    --accent:#d6a06a; --ok:#5fd394; --okbg:#173326; --warn:#f0b452; --warnbg:#3a2c12;
    --mid:#8cc0f0; --midbg:#18283a;
    --off:#8f8a83; --offbg:#2a2826; --chip:#2c2a27; --no:#ff7b6b; --nobg:#3a1a16; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;letter-spacing:-.2px}
h1 span{color:var(--accent)}
.upd{font-size:12px;color:var(--muted);text-align:right}
.search{position:relative;margin-top:10px}
.search input{width:100%;font-size:18px;padding:14px 44px 14px 44px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:24px;width:38px;height:38px;border-radius:50%;display:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip[data-f=local]{background:var(--okbg);color:var(--ok);font-weight:700}
.chip[data-f=dep]{background:var(--midbg);color:var(--mid);font-weight:700}
.chip[data-f=mega]{background:var(--warnbg);color:var(--warn);font-weight:700}
.chip[data-f=local].on{background:var(--ok);color:#fff}
.chip[data-f=dep].on{background:var(--mid);color:#fff}
.chip[data-f=mega].on{background:var(--warn);color:#fff}
@media (prefers-color-scheme: dark){ .chip[data-f=local].on,.chip[data-f=dep].on,.chip[data-f=mega].on{color:#111} }
.cats{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px;white-space:nowrap}
.cat.c-ofe{border-color:var(--ok);color:var(--ok);font-weight:700}
.cat.c-ofe.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cat.c-merc{border-color:var(--mid);color:var(--mid);font-weight:700}
.cat.c-merc.on{background:var(--mid);border-color:var(--mid);color:#fff}
.mbig{display:flex;align-items:baseline;gap:8px;margin-top:10px;background:var(--midbg);color:var(--mid);border-radius:10px;padding:10px 12px}
.mbig span{font-size:13px;font-weight:600}
.mbig b{font-size:22px}
.mbig small{margin-left:auto;font-size:13px;font-weight:700}
.mdet{font-size:13px;color:var(--muted);margin-top:6px}
.mo{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
.mnote{font-size:12.5px;background:var(--midbg);color:var(--mid);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.st-off{background:var(--offbg);color:var(--off)}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.nov{display:flex;align-items:center;gap:6px;width:100%;margin:2px 0 8px;border:0;border-radius:12px;padding:9px 12px;background:#fff4c2;color:#5c4400;font-size:13px;text-align:left}
.nov span{flex:1}
.nov i{font-style:normal;font-weight:700;text-decoration:underline}
@media (prefers-color-scheme: dark){ .nov{background:#3a3110;color:#f3dc8a} }
.nh{font-size:15px;margin:16px 0 6px}
.nl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;margin-top:5px;font-size:13px}
.nl b{display:block;font-size:13.5px}
.nl span{color:var(--muted);font-size:12px}
.nl.off b{color:var(--off)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.b-new{background:#e0edff;color:#1d4ed8}
.b-pre{background:#efe3ff;color:#6b21a8}
@media (prefers-color-scheme: dark){ .b-new{background:#17284a;color:#9cc2ff} .b-pre{background:#2e1a45;color:#d3b0ff} }
.pch{font-size:12.5px;color:#6b21a8;margin-top:6px;font-weight:600}
@media (prefers-color-scheme: dark){ .pch{color:#d3b0ff} }
.st-ult{background:#fff1d6;color:#a15c00}
.tag.t-ult{background:#a15c00 !important;color:#fff}
.banner{margin:6px 0 10px;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--warnbg);color:var(--warn)}
.hint{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px;line-height:1.5}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.name{font-weight:700;font-size:17px;line-height:1.3}
.code{font-size:12.5px;color:var(--muted);margin-top:3px}
.disc{display:inline-block;font-size:11px;font-weight:700;background:var(--offbg);color:var(--off);padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
.status{display:inline-block;margin:8px 6px 0 0;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px}
.st-ok{background:var(--okbg);color:var(--ok)}
.st-warn{background:var(--warnbg);color:var(--warn)}
.st-mid{background:var(--midbg);color:var(--mid)}
.st-no{background:var(--nobg);color:var(--no)}
.price{display:flex;gap:8px;margin-top:10px}
.price div{flex:1;background:var(--chip);border-radius:10px;padding:8px 10px}
.price b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.price span{font-size:12px;color:var(--muted)}
.loc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-radius:12px;padding:11px 12px;margin-top:8px}
.loc .dep{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.loc .qty{font-size:22px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.loc .qty small{font-size:13px;font-weight:600;opacity:.75}
.loc .det{font-size:13px;grid-column:1/-1;font-variant-numeric:tabular-nums;opacity:.85}
.loc .lotes{font-size:12px;grid-column:1/-1;opacity:.75;margin-top:2px}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px;background:rgba(255,255,255,.55)}
@media (prefers-color-scheme: dark){ .tag{background:rgba(0,0,0,.25)} }
.l-ok{background:var(--okbg);color:var(--ok)}
.l-no{background:var(--nobg);color:var(--no)}
.l-mid{background:var(--midbg);color:var(--mid)}
.l-far{background:var(--warnbg);color:var(--warn)}
.l-zero{background:var(--offbg);color:var(--off)}
.ofin{font-size:12.5px;color:var(--ok);margin-top:6px;font-weight:600}
.ofb{color:var(--ok);font-weight:800;white-space:nowrap}
.price.offer div{background:var(--okbg)}
.price.offer b{color:var(--ok)}
.price s{display:block;opacity:.8;white-space:nowrap;font-size:12px}
.addq{margin-top:10px;width:100%;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:10px;border-radius:10px}
.addq.in{border-style:solid;background:var(--chip)}
.foot .in{gap:8px}
#cotBtn{background:var(--accent);color:#fff}
.ci{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.ci .t{font-weight:700;font-size:14px;line-height:1.3}
.ci .r{display:flex;align-items:center;gap:8px;margin-top:8px}
.ci input{width:110px;font-size:18px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.ci .x{margin-left:auto;border:0;background:var(--nobg);color:var(--no);border-radius:8px;padding:8px 10px;font-weight:700}
.ci .calc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.ci .calc b{color:var(--ink)}
.pagos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pg{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;font-size:13.5px;font-weight:600}
.pg small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.pg.on{border-color:var(--accent);background:var(--accent);color:#fff}
.pg.on small{color:#fff}
.tl{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;color:var(--muted)}
.org{margin-top:8px}
.lotw{margin-top:8px;border-radius:8px;padding:8px 10px;background:#fff1d6;color:#7a4500;font-size:12.5px;line-height:1.5}
.lotw div{margin-top:3px}
.lots{margin-top:5px !important;font-weight:600}
.lot1{margin-top:6px;font-size:12.5px;color:var(--ok);font-weight:600}
@media (prefers-color-scheme: dark){ .lotw{background:#3a2a10;color:#f0c98a} }
.orgt{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.orgl{display:flex;justify-content:space-between;border-radius:8px;padding:6px 10px;margin-top:4px;font-size:13px;font-weight:600}
.orgn{font-size:12.5px;font-weight:600;color:var(--warn);margin-top:5px}
.ci .warn{color:var(--no);font-weight:600}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cf input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.cf .full{grid-column:1/-1}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:10px;border-top:2px solid var(--ink);font-size:16px}
.tot b{font-size:24px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.chk input{width:20px;height:20px}
.btn.wa{flex:1;font-size:16px;padding:14px;display:block;text-align:center;text-decoration:none;background:#1f9d55;color:#fff}
.more{text-align:center;color:var(--muted);font-size:13px;padding:10px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:18px 14px 14px;pointer-events:none}
.foot .in{max-width:640px;margin:0 auto;display:flex;justify-content:center}
.foot .btn{pointer-events:auto}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--accent);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.btn:disabled{opacity:.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.sheet p,.sheet li{font-size:14px;line-height:1.5;color:var(--ink)}
.sheet .mut{color:var(--muted)}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .btn{flex:1}
.err{color:#c0392b}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
mark{background:transparent;color:var(--accent);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Stock <span>Navarro Ache</span></h1>
      <div class="upd" id="upd">Cargando…</div>
    </div>
    <div class="search">
      <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Producto, medida, marca, código u “oferta”">
      <button class="clr" id="clr" aria-label="Borrar">×</button>
    </div>
    <div class="chips">
      <button class="chip on" data-f="all">Todos</button>
      <button class="chip" data-f="local">Mi local</button>
      <button class="chip" data-f="dep">Depósito Mashwitz</button>
      <button class="chip" data-f="mega">Dep Mega</button>
    </div>
    <div class="cats">
      <button class="cat on" data-c="all">Todas</button><button class="cat c-ofe" data-c="ofe">🏷️ Ofertas</button><button class="cat" data-c="piso">Porcelanatos y cerámicos</button><button class="cat" data-c="acomp">Acompañamiento</button><button class="cat" data-c="grif">Grifería</button><button class="cat" data-c="sani">Sanitarios</button><button class="cat" data-c="ins">Insumos</button><button class="cat" data-c="otros">Otros</button><button class="cat c-merc" data-c="merc">📦 Mercadería a recibir</button>
    </div>
  </header>
  <button id="novBtn" class="nov" style="display:none"></button>
  <div id="banner"></div>
  <main id="list"><div class="hint">Cargando stock…</div></main>
  <div id="src" style="text-align:center;font-size:12px;color:var(--muted);padding:6px 0 20px"></div>
</div>

<div class="foot"><div class="in">
  <button class="btn sec" id="upBtn" style="display:none">⬆ Cargar Excel del día</button>
  <button class="btn" id="cotBtn" style="display:none">🧾 Cotización</button>
</div></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script id="emb" type="application/json">/*EMB*/null</script>
<script>
/* ===== Ubicaciones =====
   rank 0 = tu local (primero), 1 = depósito Mashwitz, 2 = Dep Mega (más lejos) */
function depInfo(raw){
  const d = norm(raw).replace(/[^a-z]/g,"");
  if (d.includes("mega")) return {rank:2, name:"Dep Mega", tag:"MÁS LEJOS"};
  if (d.startsWith("dep")) return {rank:1, name: d.includes("mash")||d.includes("masch") ? "Depósito Mashwitz" : pretty(raw), tag:"DEPÓSITO"};
  if (d.includes("mash") || d.includes("masch") || d.includes("local")) return {rank:0, name:"Mi local (Mashwitz)", tag:"TU LOCAL"};
  return {rank:1, name: pretty(raw) || "Sin ubicación", tag:""};
}
const LOCAL_NAME = "Mi local (Mashwitz)";
const CATS = {ofe:"Ofertas", piso:"Porcelanatos y cerámicos", acomp:"Acompañamiento", ins:"Insumos", grif:"Grifería", sani:"Sanitarios", otros:"Otros"};
function categoria(p){
  if (!p.unit) return "piso";
  const m = norm(p.marca), n = norm(p.nombre);
  if (/^insumos|administracion|cgpacheco/.test(m) || /^insumo/.test(n)) return "otros";
  if (/home navarro/.test(m) || /desague/.test(n)) return "sani";
  if (/studio prima/.test(m)) return "piso";
  if (/piazza/.test(m)) return /bacha|banera isla|ba.era isla/.test(n) ? "sani" : "grif";
  if (/^fv$|peirano|robinet|hidromet/.test(m)) return "grif";
  if (/ferrum|^roca|pringles|lavaica|johnson/.test(m)) return "sani";
  // Acompañamiento: pegamento, pastina, tornillos y tuercas niveladores
  if (/^(disc-\s*)?weber|pastina|pegamento|adhesivo/.test(n) && !/sellador/.test(n)) return "acomp";
  if (/nivelador.*(tornillo|tuerca)/.test(n)) return "acomp";
  // Insumos de colocación que se venden
  if (/abrasivos/.test(m) && !/silicona|sellador/.test(n)) return "otros";   // amoladora, discos, brocas, etc.
  if (/moldumet|lourdes|rgo vision/.test(m) || /sellador|silicona|zocalo|guardac|listel|omega|herramienta|caballete|nivelador/.test(n)) return "ins";
  return "otros";
}
// Orden fijo de Acompañamiento: pegamentos en este orden, después pastinas, tornillos y tuercas
const ACOMP_ORDEN = ["92-0021","92-0102","92-0126","92-0151","92-0143"];
function acompRank(p){
  const n = norm(p.nombre), i = ACOMP_ORDEN.indexOf(p.codigo);
  if (i>=0) return i;
  if (/tornillo/.test(n)) return 300;
  if (/tuerca/.test(n)) return 301;
  if (/color|pastina/.test(n)) return 200;
  return 100;   // otros pegamentos
}
const POCAS = p => p.unit ? 2 : 5;   // "últimas": hasta 5 cajas o 2 unidades en tu local
const CHUNK = 450;          // filas por documento
const MAX_SHOW = 50;        // resultados visibles

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d=2) => (n==null||isNaN(n)) ? "–" : Number(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:d});
const money = n => "$ " + Number(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pretty = s => String(s||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).trim();
const fixName = s => String(s||"").replace(/¥/g,"Ñ").replace(/\\/g,"Ñ").replace(/\s+/g," ").trim();
const DIM = /^[.\s]*(disc-)?\s*\d+([.,]\d+)?\s*x\s*\d+/i;
const DIMANY = /(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:[.,]\d+)?)/i;
function num(v){
  if (v==null || v==="") return null;
  if (typeof v==="number") return isFinite(v)?v:null;
  let s = String(v).replace(/[^\d,.\-]/g,"");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if ((s.match(/\./g)||[]).length>1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g,"");
  const n = parseFloat(s); return isFinite(n)?n:null;
}

/* ===== Estado ===== */
// fila: [nombre, codigo, ubicacion, metros, cajas/unidades, m2PorCaja, precio, precioCaja, lote, marca]
const EMB = JSON.parse(document.getElementById("emb").textContent || "null");
let limit = 50;
let cat = "all";
let rows = [], products = [], meta = null, filter = "all", db = null, canWrite = false;

function buildProducts(){
  const map = new Map();
  for (const r of rows){
    const [nombre, codigo, dep, m2, cajas, mc, pm, pc, lote, marca] = r;
    const key = codigo ? "c:"+norm(codigo) : "n:"+norm(nombre);
    let p = map.get(key);
    if (!p){
      p = {nombre, codigo, marca, mc, pm, pc, locs:new Map()};
      map.set(key,p);
    }
    if (!p.mc && mc) p.mc = mc;
    if (!p.pm && pm) p.pm = pm;
    if (!p.pc && pc) p.pc = pc;
    const info = depInfo(dep);
    let l = p.locs.get(info.name);
    if (!l){ l = {...info, m2:0, cajas:0, lotes:[]}; p.locs.set(info.name, l); }
    l.m2 = Math.round((l.m2 + (m2||0))*100)/100; l.cajas = Math.round((l.cajas + (cajas||0))*100)/100;
    if (lote) l.lotes.push({lote, cajas:cajas||0});
  }
  products = [...map.values()];
  for (const p of products){
    // Producto por unidad (grifería, sanitarios, pegamentos…): sin medida y 1 (o 0) m² por caja
    p.unit = !DIMANY.test(p.nombre) || ((!p.mc || p.mc===1) && !DIM.test(p.nombre));
    if (!p.unit && !p.pc && p.pm && p.mc) p.pc = Math.round(p.pm*p.mc*100)/100;
    p.disc = /^[.\s]*disc-/i.test(p.nombre);
    // placas por caja = m² por caja ÷ m² de una placa (solo si da entero con <2% de diferencia)
    p.placas = null;
    const dm = !p.unit && p.mc && p.nombre.match(DIMANY);
    if (dm){ const pl = parseFloat(dm[1].replace(",","."))*parseFloat(dm[2].replace(",","."))/10000; const n = p.mc/pl, r = Math.round(n);
      if (r>=1 && Math.abs(n-r)/r <= 0.02) p.placas = r; }
    const of = EMB && EMB.ofertas && EMB.ofertas[p.codigo];
    p.of = of ? {po: of.po, pct: of.pct, fin: of.fin, pc: (!p.unit && p.mc) ? Math.round(of.po*p.mc*100)/100 : null} : null;
    p.locs = [...p.locs.values()].sort((a,b)=>a.rank-b.rank);
    for (const l of p.locs){
      // agrupar lotes repetidos
      const m = new Map(); for (const x of l.lotes){ const k = x.lote.toUpperCase(); m.set(k,(m.get(k)||0)+x.cajas); }
      l.lotes = [...m.entries()];
    }
    const has = l => l.cajas>0 || l.m2>0;
    p.local = p.locs.some(l => l.rank===0 && has(l));
    p.near = p.locs.some(l => l.rank===1 && has(l));
    p.far = p.locs.some(l => l.rank===2 && has(l));
    p.any = p.locs.some(has);
    p.cat = categoria(p);
    const nov = EMB && EMB.nov;
    p.nuevo = !!(nov && nov.nuevos && nov.nuevos.includes(p.codigo));
    p.cambio = nov && nov.precios ? nov.precios.find(x=>x.c===p.codigo) || null : null;
    const lc = p.locs.filter(l=>l.rank===0).reduce((a,l)=>a+(l.cajas||0),0);
    p.ultimas = lc>0 && lc<=POCAS(p) ? lc : 0;
    p.s = norm([p.nombre, p.codigo, p.marca, p.of?"oferta ofertas":"", p.nuevo?"nuevo nuevos":""].join(" ")) + " " + norm(p.nombre).replace(/[.,]/g,"");
  }
}

/* ===== Render ===== */
function highlight(text, words){
  const t = norm(text);
  let best = null;
  for (const w of words){ if (w.length<2) continue; const i = t.indexOf(w); if (i>=0 && (!best || w.length>best[1])) best=[i,w.length]; }
  if (!best || t.length!==text.length) return esc(text);
  const [i,n] = best;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+n)) + "</mark>" + esc(text.slice(i+n));
}
function priceHtml(p){
  if (p.of){
    const was = p.pm ? `<s>${money(p.pm)}</s>` : "";
    if (p.unit) return `<div class="price offer"><div><b>${money(p.of.po)}</b><span>oferta por unidad ${was}</span></div></div>`;
    return `<div class="price offer"><div><b>${money(p.of.po)}</b><span>oferta por m² ${was}</span></div>${p.of.pc?`<div><b>${money(p.of.pc)}</b><span>oferta por caja${p.placas?` (${p.placas} placa${p.placas>1?"s":""})`:""} ${p.pc?`<s>${money(p.pc)}</s>`:""}</span></div>`:""}</div>`;
  }
  if (!p.pm) return `<div class="price"><div><b>Sin precio</b><span>consultar</span></div></div>`;
  if (p.unit) return `<div class="price"><div><b>${money(p.pm)}</b><span>por unidad</span></div></div>`;
  return `<div class="price"><div><b>${money(p.pm)}</b><span>por m²</span></div>${p.pc?`<div><b>${money(p.pc)}</b><span>por caja (${fmt(p.mc,3)} m²${p.placas?` · ${p.placas} placa${p.placas>1?"s":""}`:""})</span></div>`:""}</div>`;
}
function locHtml(p, l){
  const zero = !(l.cajas>0 || l.m2>0);
  let cls, icon = "";
  if (l.rank===0){ cls = zero ? "l-no" : "l-ok"; icon = zero ? "✕ " : "✓ "; }
  else if (zero) cls = "l-zero";
  else cls = l.rank===2 ? "l-far" : "l-mid";
  const tag = l.rank===0 && zero ? "SIN STOCK" : (l.rank===0 && p.ultimas ? (p.unit ? `ÚLTIMAS ${fmt(p.ultimas,0)} U.` : `ÚLTIMAS ${fmt(p.ultimas,0)} CAJAS`) : l.tag);
  const qty = p.unit
    ? `${fmt(l.cajas,0)} <small>u.</small>`
    : `${fmt(l.m2)} <small>m²</small>`;
  const det = zero ? (l.rank===0 ? "No hay en tu local" : "Sin stock")
    : p.unit ? `${fmt(l.cajas,0)} ${l.cajas===1?"unidad":"unidades"}`
    : `${fmt(l.cajas,0)} cajas · ${fmt(p.mc,3)} m² por caja · ${p.placas?`<b>${p.placas} placa${p.placas>1?"s":""} por caja</b>`:"placas por caja: consultar"}`;
  const lotes = !zero && l.lotes.length ? `<div class="lotes">Lote${l.lotes.length>1?"s":""}: ${l.lotes.map(([k,c])=>`${esc(k)} (${fmt(c,0)}${p.unit?" u.":" cj"})`).join(" · ")}</div>` : "";
  return `<div class="loc ${cls}">
    <div class="dep">${icon}${esc(l.name)} ${tag?`<span class="tag${/^ÚLTIMAS/.test(tag)?" t-ult":""}">${tag}</span>`:""}</div>
    <div class="qty">${zero?"0":qty}</div>
    <div class="det">${det}</div>${lotes}</div>`;
}
function cardHtml(p, words){
  let st;
  if (p.local) st = `<span class="status st-ok">✓ Hay en tu local</span>${p.ultimas?`<span class="status st-ult">⚠ Últimas ${fmt(p.ultimas,0)} ${p.unit?"u.":p.ultimas===1?"caja":"cajas"} en tu local</span>`:""}`;
  else {
    st = `<span class="status st-no">✕ No hay en tu local</span>`;
    if (p.near) st += `<span class="status st-mid">Hay en Depósito Mashwitz</span>`;
    else if (p.far) st += `<span class="status st-warn">Hay en Dep Mega</span>`;
  }
  let locs = [...p.locs];
  if (!locs.some(l=>l.rank===0)) locs.unshift({rank:0, name:LOCAL_NAME, tag:"TU LOCAL", m2:0, cajas:0, lotes:[]});
  if (filter==="local"){ locs = locs.filter(l=>l.rank===0); st = `<span class="status st-ok">✓ Hay en tu local</span>`; }
  if (filter==="dep"){ locs = locs.filter(l=>l.rank===1); st = `<span class="status st-mid">Hay en Depósito Mashwitz</span>`; }
  if (filter==="mega"){ locs = locs.filter(l=>l.rank===2); st = `<span class="status st-warn">Hay en Dep Mega</span>`; }
  return `<div class="card">
    <div class="name">${highlight(p.nombre, words)}${p.of?` <span class="ofb">(OFERTA -${fmt(p.of.pct,1)}%)</span>`:""}${p.disc?`<span class="disc">DISCONTINUO</span>`:""}${p.nuevo?`<span class="badge b-new">NUEVO</span>`:""}${p.cambio?`<span class="badge b-pre">PRECIO ACTUALIZADO</span>`:""}</div>
    <div class="code">Cód. ${esc(p.codigo||"–")}${p.marca?" · "+esc(p.marca):""}</div>
    ${priceHtml(p)}${p.cambio?`<div class="pch">Precio anterior: ${money(p.cambio.a)} → ahora ${money(p.cambio.b)} (${p.cambio.b>p.cambio.a?"+":""}${fmt((p.cambio.b/p.cambio.a-1)*100,1)}%)</div>`:""}${p.of&&p.of.fin?`<div class="ofin">Oferta válida hasta el ${p.of.fin.slice(8,10)}/${p.of.fin.slice(5,7)}/${p.of.fin.slice(0,4)}</div>`:""}${st}${locs.map(l=>locHtml(p,l)).join("")}
    ${p.pm||p.of?`<button class="addq${inCot(p.codigo)?" in":""}" data-code="${esc(p.codigo)}">${inCot(p.codigo)?"✓ En la cotización — ver":"+ Cotizar"}</button>`:""}</div>`;
}
function render(){
  const raw = $("#q").value, q = norm(raw);
  $("#clr").style.display = q ? "block" : "none";
  const list = $("#list");
  if (!rows.length){
    list.innerHTML = `<div class="hint">Todavía no hay stock cargado.<br>${canWrite?"Tocá <b>Cargar Excel del día</b> abajo.":"Cuando se cargue el Excel va a aparecer acá."}</div>`;
    return;
  }
  const words = q.split(/\s+/).filter(Boolean);
  if (cat==="merc") return renderMerc(words, raw);
  let res = products.filter(p => words.every(w => p.s.includes(w)));
  if (filter==="local") res = res.filter(p => p.local);
  if (filter==="dep") res = res.filter(p => p.near);
  if (filter==="mega") res = res.filter(p => p.far);
  if (filter==="all") res = res.filter(p => p.any);
  if (cat==="ofe") res = res.filter(p => p.of);
  else if (cat!=="all") res = res.filter(p => p.cat===cat);
  res.sort((a,b)=> (b.local-a.local) || (b.any-a.any) || (a.disc-b.disc) || a.nombre.localeCompare(b.nombre,"es"));
  if (!res.length){ list.innerHTML = `<div class="hint">${q?`No encontré nada con “${esc(raw)}”.<br>Probá con menos palabras o solo la medida.`:"No hay productos con estos filtros."}</div>`; return; }
  if (!q && cat==="acomp") res.sort((a,b)=> (acompRank(a)-acompRank(b)) || (a.disc-b.disc) || a.nombre.localeCompare(b.nombre,"es"));
  else if (!q) res.sort((a,b)=> cat==="ofe" ? (b.of.pct-a.of.pct) || a.nombre.localeCompare(b.nombre,"es") : (a.disc-b.disc) || a.nombre.replace(/^[.\s]+/,"").localeCompare(b.nombre.replace(/^[.\s]+/,""),"es"));
  const label = (cat!=="all" ? " · "+CATS[cat] : "") + (filter==="local" ? " en tu local" : filter==="mega" ? " en Dep Mega" : filter==="dep" ? " en Depósito Mashwitz" : "");
  const shown = res.slice(0,limit);
  list.innerHTML = `<div class="count">${res.length.toLocaleString("es-AR")} producto${res.length>1?"s":""}${label}${q?" para “"+esc(raw)+"”":""}</div>` + shown.map(p=>cardHtml(p,words)).join("")
    + (res.length>limit?`<div class="more">Mostrando ${limit} de ${res.length.toLocaleString("es-AR")}<br><button class="btn sec" id="moreBtn" style="margin-top:8px">Ver más</button></div>`:"");
  const mb = $("#moreBtn"); if (mb) mb.onclick = ()=>{ limit += MAX_SHOW; render(); };
}

/* ===== Lectura del Excel ===== */
function loadXLSX(){
  return new Promise((ok,ko)=>{
    if (window.XLSX) return ok(window.XLSX);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=>ok(window.XLSX); s.onerror = ()=>ko(new Error("No se pudo cargar el lector de Excel. Revisá la conexión."));
    document.head.appendChild(s);
  });
}
const KW_STRIP = /(m2|m²|mts2?|metros?( cuadrados)?|metraje|cajas?|cjs|bultos?|stock|cant(idad)?|disp(onible)?|en|de|x|por|\.|:|-|_|\(|\))/g;
function classify(h){
  const n = norm(h).replace(/²/g,"2");
  if (!n) return null;
  if (/(precio|valor|importe|\$|lista|pvp)/.test(n)) return {k: /(caja|cj)/.test(n) ? "pc" : "pm"};
  if (/(cod|sku)/.test(n)) return {k:"codigo"};
  if (/lote|partida|tono/.test(n)) return {k:"lote"};
  if (/marca|proveedor|fabric/.test(n)) return {k:"marca"};
  if (/(deposito|ubicacion|sucursal|almacen|lugar)/.test(n) && !/(m2|metro|caja)/.test(n)) return {k:"dep"};
  if (/(m2|mts|metro).*(caja|cj)|(caja|cj).*(m2|mts|metro)|rendimiento|m2\/c/.test(n)) return {k:"mc"};
  const rest = n.replace(KW_STRIP," ").replace(/\s+/g," ").trim();
  if (/(m2|mts|metro|metraje)/.test(n)) return {k:"m2", dep: rest || null};
  if (/(caja|cjs|bulto|disponible|unidades|cantidad)/.test(n)) return {k:"cajas", dep: rest || null};
  if (/(producto|descr|nombre|articulo|detalle|modelo)/.test(n)) return {k:"nombre"};
  return null;
}
function parseSheet(XLSX, wb){
  let best = null;
  for (const name of wb.SheetNames){
    const a = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:"", raw:true});
    if (!best || a.length > best.length) best = a;
  }
  const A = best || [];
  let hi = -1, cols = null;
  for (let i=0;i<Math.min(20,A.length);i++){
    const c = A[i].map(classify);
    if (c.some(x=>x&&x.k==="nombre") && c.some(x=>x&&(x.k==="m2"||x.k==="cajas"))){ hi=i; cols=c; break; }
  }
  if (hi<0) throw new Error("No encontré los encabezados. Necesito al menos una columna de Producto y una de Metros o Cajas.");
  const idx = k => cols.findIndex(x=>x&&x.k===k);
  const iN = idx("nombre"), iC = idx("codigo"), iD = idx("dep"), iMC = idx("mc"), iPM = idx("pm"), iPC = idx("pc"), iL = idx("lote"), iMa = idx("marca");
  const m2cols = cols.map((x,i)=>x&&x.k==="m2"?{i,dep:x.dep}:null).filter(Boolean);
  const cjcols = cols.map((x,i)=>x&&x.k==="cajas"?{i,dep:x.dep}:null).filter(Boolean);
  const wide = iD<0 && (m2cols.length>1 || cjcols.length>1 || m2cols.some(c=>c.dep) || cjcols.some(c=>c.dep));
  const out = []; let skipped = 0;
  for (let r=hi+1;r<A.length;r++){
    const row = A[r];
    const nombre = fixName(row[iN]);
    if (!nombre){ if (row.some(c=>c!=="" && c!=null)) skipped++; continue; }
    const codigo = iC>=0 ? String(row[iC]??"").trim() : "";
    const mc = iMC>=0 ? num(row[iMC]) : null;
    const lote = iL>=0 ? String(row[iL]??"").trim() : "";
    const marca = iMa>=0 ? String(row[iMa]??"").trim() : "";
    let pm = iPM>=0 ? num(row[iPM]) : null, pc = iPC>=0 ? num(row[iPC]) : null;
    if (!pm && pc && mc) pm = +(pc/mc).toFixed(2);
    const push = (dep, m2, cj) => {
      if (m2==null && cj!=null && mc) m2 = +(cj*mc).toFixed(2);
      if (cj==null && m2!=null && mc) cj = +(m2/mc).toFixed(1);
      out.push([nombre, codigo, dep, m2, cj, mc, pm||null, pc||null, lote, marca]);
    };
    if (wide){
      const deps = new Map();
      for (const c of m2cols){ const d=c.dep||"general"; deps.set(d,{...(deps.get(d)||{}), m2:num(row[c.i])}); }
      for (const c of cjcols){ const d=c.dep||"general"; deps.set(d,{...(deps.get(d)||{}), cj:num(row[c.i])}); }
      for (const [d,v] of deps) push(pretty(d), v.m2??null, v.cj??null);
    } else {
      const dep = iD>=0 ? String(row[iD]??"").trim() : "";
      push(dep, m2cols.length?num(row[m2cols[0].i]):null, cjcols.length?num(row[cjcols[0].i]):null);
    }
  }
  const found = ["Producto"]; if(iC>=0)found.push("Código"); if(iMa>=0)found.push("Marca"); if(iD>=0)found.push("Ubicación");
  if(m2cols.length)found.push("Metros"); if(cjcols.length)found.push("Cajas/unidades"); if(iMC>=0)found.push("m² por caja");
  if(iPM>=0)found.push("Precio"); if(iPC>=0)found.push("Precio caja"); if(iL>=0)found.push("Lote");
  return {rows: out, found, wide, skipped};
}

let busy = false, pending = null, pendingName = "";
$("#file").addEventListener("change", async e=>{

    const deps = new Map();
    for (const r of res.rows){ const i = depInfo(r[2]); const o = deps.get(i.name)||{rank:i.rank, raw:r[2], n:0, m2:0, u:0};
      o.n++; if (DIM.test(r[0]) || (r[5] && r[5]!==1)) o.m2 += r[3]||0; else o.u += r[4]||0; deps.set(i.name,o); }

      <p class="mut">Columnas detectadas: ${res.found.join(", ")}</p>
      <p>Control por ubicación (compará con tu sistema):</p><ul>${depList}</ul>
      ${res.skipped?`<p class="mut">${res.skipped} filas sin nombre de producto no se cargan.</p>`:""}
      ${sinPrecio?`<p class="mut">${sinPrecio} productos tienen precio 0 → van a decir “Sin precio”.</p>`:""}
      ${!db?`<p class="err">No hay conexión con la base: el stock solo se va a ver en este dispositivo hasta que recargues.</p>`:""}
      <div class="bar" id="bar" style="display:none"><i></i></div>

async function save(){
  if (!pending) return;
  const data = pending;
  if (!db){ rows = data; meta = {updatedAt: Date.now()}; buildProducts(); renderMeta(); render(); closeModal(); return; }
  busy = true; $("#ok").disabled = $("#cancel").disabled = true;
  $("#bar").style.display = "block";
  const v = Date.now(), n = Math.ceil(data.length/CHUNK);
  try{
    for (let i=0;i<n;i++){
      await db.doc("stock/p"+String(i).padStart(3,"0")).set({v, i, items: JSON.stringify(data.slice(i*CHUNK,(i+1)*CHUNK))});
      $("#bar i").style.width = ((i+1)/(n+1)*100)+"%";
    }
    await db.doc("meta/info").set({v, chunks:n, count:data.length, updatedAt:v, ejemplo:false, file: pendingName});
    const all = await db.collection("stock").get();
    for (const d of all.docs){ const k = parseInt(d.id.slice(1),10); if (k>=n) await db.doc("stock/"+d.id).delete(); }
    $("#bar i").style.width = "100%";
    pending = null; busy = false; closeModal();
    $("#q").value=""; filter="all"; document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.f==="all"));
  }catch(err){
    busy = false;
    $("#msg").innerHTML = `<p class="err">Error al guardar: ${esc(err.message||err.code)}. Probá de nuevo.</p>`;
    $("#ok").disabled = $("#cancel").disabled = false;
  }
}

/* ===== Mercadería a recibir (solo se ve en su botón) ===== */
let MERC = null;
function buildMerc(){
  const rows = (EMB && EMB.merc) || []; const map = new Map();
  for (const [c,n,marca,f,comp,rec,cpr,rr,nro] of rows){
    const k = c || n; let m = map.get(k);
    if (!m){ m = {c, n, marca, ord:[], rr:0, comp:0, rec:0, cpr:0}; map.set(k,m); }
    m.ord.push({f, nro, comp, rec, cpr, rr}); m.rr += rr; m.comp += comp; m.rec += rec; m.cpr += cpr;
  }
  const today = new Date().toISOString().slice(0,10);
  MERC = [...map.values()].map(m=>{

let cot = {items:[], cliente:"", tel:"", vend:"", desp:false, pago:"efe", desc5:false};

function inCot(code){ return cot.items.some(i=>i.code===code); }
function prodBy(code){ return products.find(p=>p.codigo===code); }
function updCotBtn(){ const n = cot.items.length; const b = $("#cotBtn"); b.style.display = n ? "block" : "none"; b.textContent = `🧾 Cotización (${n})`; }
const r2 = n => Math.round(n*100)/100;
const PAGOS = {efe:"Efectivo / Transferencia", t1:"Débito o crédito 1 pago", t3:"Crédito 3 cuotas", t6:"Crédito 6 cuotas"};
function puedeDesc5(){ return cot.pago==="efe" && cot.items.some(it=>{ const p = prodBy(it.code); return p && !p.of; }); }
function ajuste(p){ // devuelve {f, txt}
  if (cot.pago==="t3") return {f:1.15, txt:"+15% (3 cuotas)"};
  if (cot.pago==="t6") return {f:1.25, txt:"+25% (6 cuotas)"};
  if (cot.desc5 && puedeDesc5()) return p.of ? {f:1, txt:"oferta: sin 5% extra"} : {f:0.95, txt:"-5% efectivo/transferencia"};
  return {f:1, txt:""};
}
function lineCalc(it){
  const p = prodBy(it.code); if (!p) return null;
  const q = Math.max(0, +String(it.q||"").replace(",",".") || 0);
  const price = p.of ? p.of.po : p.pm;            // por m² o por unidad
  const stockC = p.locs.reduce((a,l)=>a+(l.cajas||0),0), localC = p.locs.filter(l=>l.rank===0).reduce((a,l)=>a+(l.cajas||0),0);
  const aj = ajuste(p), fin = sub => ({sub, aj, fin: r2(sub*aj.f)});
  if (p.unit){ const n = Math.ceil(q-1e-9); return {p, unit:true, q, n, price, ...fin(r2(n*(price||0))), stockC, localC}; }
  if (!p.mc) return {p, unit:false, q, cajas:null, m2:q, price, ...fin(r2(q*(price||0))), stockC, localC};
  const want = cot.desp ? q*1.1 : q;
  const cajas = Math.ceil(want/p.mc - 1e-9);
  const pc = p.of ? p.of.pc : p.pc;
  return {p, unit:false, q, want, cajas, m2: r2(cajas*p.mc), price, pc, ...fin(r2(cajas*(pc||0))), stockC, localC};
}
function calcHtml(c){

  if (!c.q) return `Escribí la cantidad.`;
  const of = c.p.of ? ` <b style="color:var(--ok)">(OFERTA -${fmt(c.p.of.pct,1)}%)</b>` : "";
  let h;
  if (c.unit) h = `<b>${fmt(c.n,0)} u.</b> × ${money(c.price)}${of} = <b>${money(c.sub)}</b>`;
  else if (c.cajas==null) h = `<b>${fmt(c.m2)} m²</b> × ${money(c.price)}${of} = <b>${money(c.sub)}</b>`;
  else h = `${cot.desp?`${fmt(c.q)} m² + 10% = ${fmt(c.want)} m² → `:""}<b>${fmt(c.cajas,0)} cajas = ${fmt(c.m2)} m²</b>${c.p.placas?` (${fmt(c.cajas*c.p.placas,0)} placas)`:""}<br>${fmt(c.cajas,0)} × ${money(c.pc)} por caja${of} = <b>${money(c.sub)}</b>`;
  if (c.aj.txt) h += `<br>${c.aj.f!==1?`${c.aj.txt}: <b>${money(c.fin)}</b>`:`<span style="color:var(--ok)">${c.aj.txt}</span>`}`;
  const need = c.unit ? c.n : c.cajas;
  if (need!=null) h += origenHtml(c.p, need, c.unit) + lotesHtml(c.p, need);

// Reparte lo pedido: primero Mi local, después Depósito Mashwitz, después Dep Mega
function origen(p, need){
  const out = []; let rest = need;
  for (const rank of [0,1,2]){
    const disp = p.locs.filter(l=>l.rank===rank).reduce((a,l)=>a+(l.cajas||0),0);
    if (rest>0 && disp>0){ const take = Math.min(rest, disp); out.push({rank, take, disp}); rest = r2(rest-take); }
  }
  return {out, falta: rest>0 ? rest : 0};
}
// Reparte por lote (mismo orden de ubicaciones; dentro de cada una, primero el lote con más cajas)
function lotesUsados(p, need){
  const used = []; let rest = need;
  for (const rank of [0,1,2]) for (const l of p.locs.filter(l=>l.rank===rank)){
    for (const [k,c] of [...l.lotes].sort((a,b)=>b[1]-a[1])){
      if (rest<=0) break; if (c<=0) continue;
      const take = Math.min(rest, c); used.push({k, take, rank}); rest = r2(rest-take);
    }
  }
  return used;
}
function lotesHtml(p, need){
  if (p.unit || !need) return "";
  const used = lotesUsados(p, need);
  if (used.length<=1) return used.length ? `<div class="lot1">✓ Sale todo de un mismo lote (${esc(used[0].k)})</div>` : "";
  const NAMES = ["Mi local","Dep. Mashwitz","Dep Mega"];
  const uno = []; for (const rank of [0,1,2]) for (const l of p.locs.filter(l=>l.rank===rank)) for (const [k,c] of l.lotes) if (c>=need) uno.push({k,c,rank});
  return `<div class="lotw"><b>⚠ Sale de ${used.length} lotes distintos</b> — puede haber diferencia de tono:
    <div>${used.map(u=>`${esc(u.k)} · ${fmt(u.take,0)} ${u.take===1?"caja":"cajas"} (${NAMES[u.rank]})`).join("<br>")}</div>
    ${uno.length?`<div class="lots">💡 Un solo lote alcanza: <b>${esc(uno[0].k)}</b> tiene ${fmt(uno[0].c,0)} cajas en ${NAMES[uno[0].rank]}${uno.length>1?` (y ${uno.length-1} lote${uno.length>2?"s":""} más)`:""}.</div>`:`<div class="lots">Ningún lote alcanza solo para todo el pedido.</div>`}</div>`;
}
function origenHtml(p, need, unit){
  if (!need) return "";
  const U = n => unit ? "u." : (n===1 ? "caja" : "cajas"), NAMES = ["Mi local","Depósito Mashwitz","Dep Mega"], CLS = ["l-ok","l-mid","l-far"];
  const {out, falta} = origen(p, need);
  let h = `<div class="org"><div class="orgt">De dónde sale:</div>`;
  for (const o of out) h += `<div class="orgl ${CLS[o.rank]}"><span>${NAMES[o.rank]}</span><b>${fmt(o.take,0)} ${U(o.take)}</b></div>`;
  const enMashwitz = out.some(o=>o.rank<2);
  if (!out.length) h += `<div class="orgl l-no"><span>✕ No hay stock en ninguna ubicación</span></div>`;
  else if (!enMashwitz) h += `<div class="orgn">⚠ No hay en tu local ni en el Depósito Mashwitz: sale todo de Dep Mega.</div>`;
  if (falta>0) h += `<div class="orgl l-no"><span>✕ Faltan</span><b>${fmt(falta,0)} ${U(falta)}</b></div><div class="orgn" style="color:var(--no)">Stock insuficiente: hay ${fmt(need-falta,0)} ${U(need-falta)} en total.</div>`;
  return h + `</div>`;
}
function cotBase(){ return r2(cot.items.reduce((a,it)=>{ const c = lineCalc(it); return a + (c?c.sub:0); },0)); }
function cotTotal(){ return r2(cot.items.reduce((a,it)=>{ const c = lineCalc(it); return a + (c?c.fin:0); },0)); }

function waNum(t){

      <input id="cTel" inputmode="tel" placeholder="Teléfono (ej. 11 2345 6789)" value="${esc(cot.tel)}">
      <input id="cVend" placeholder="Atendido por" value="${esc(cot.vend)}"></div>
    ${items || `<p class="mut">Todavía no agregaste productos. Tocá “+ Cotizar” en un producto.</p>`}
    ${cot.items.some(it=>{const c=lineCalc(it);return c&&!c.unit&&c.cajas!=null;})?`<label class="chk"><input type="checkbox" id="cDesp" ${cot.desp?"checked":""}> Agregar 10% por cortes y desperdicio</label>`:""}
    <div class="orgt" style="margin-top:14px">Forma de pago</div>
    <div class="pagos">${Object.entries(PAGOS).map(([k,v])=>`<button class="pg${cot.pago===k?" on":""}" data-pg="${k}">${v}${k==="t3"?"<small>+15%</small>":k==="t6"?"<small>+25%</small>":""}</button>`).join("")}</div>
    <label class="chk" id="cD5w" style="display:${puedeDesc5()?"flex":"none"}"><input type="checkbox" id="cD5" ${cot.desc5?"checked":""}> Aplicar 5% de descuento (no aplica a ofertas)</label>
    <div id="cTot">${totHtml()}</div>
    <p class="mut" style="font-size:12px">Precios vigentes al ${hoy()}. Se redondea a cajas completas.</p>
    <div class="row"><a class="btn wa" id="cWa" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>
    <div class="row"><button class="btn sec" id="cMore">+ Agregar productos</button><button class="btn sec" id="cClear">Vaciar</button></div>
    <div id="cMsg"></div>`);
  const refresh = ()=>{ cot.items.forEach((it,i)=>{ const el = $("#calc"+i); if (el) el.innerHTML = calcHtml(lineCalc(it)); });
    if (!puedeDesc5()) cot.desc5 = false;
    $("#cD5w").style.display = puedeDesc5() ? "flex" : "none"; $("#cD5").checked = cot.desc5;
    $("#cTot").innerHTML = totHtml(); const n = waNum(cot.tel);
    $("#cWa").href = `https://wa.me/${n}?text=${encodeURIComponent(cotText())}`;
    $("#cWa").textContent = n ? `Enviar por WhatsApp a ${cot.tel.trim()}` : "Enviar por WhatsApp (elegís el contacto)";
    $("#cRes").innerHTML = `${hoy()}${cot.cliente?` · Cliente: <b>${esc(cot.cliente)}</b>`:""}${cot.vend?` · Atendido por: <b>${esc(cot.vend)}</b>`:""} · ${PAGOS[cot.pago]}`;
    saveCot(); };
  $("#cWa").onclick = e=>{ if (!cot.items.some(it=>{const c=lineCalc(it);return c&&c.q;})){ e.preventDefault(); $("#cMsg").innerHTML = `<p class="err">Poné la cantidad de al menos un producto.</p>`; } };
  $("#sheet").querySelectorAll("input[data-i]").forEach(inp=> inp.oninput = ()=>{ cot.items[+inp.dataset.i].q = inp.value; refresh(); });
  $("#sheet").querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{ cot.items.splice(+b.dataset.del,1); saveCot(); render(); openCot(); });
  $("#cCli").oninput = e=>{ cot.cliente = e.target.value; refresh(); };
  $("#cTel").oninput = e=>{ cot.tel = e.target.value; refresh(); };
  $("#cVend").oninput = e=>{ cot.vend = e.target.value; refresh(); };
  if ($("#cDesp")) $("#cDesp").onchange = e=>{ cot.desp = e.target.checked; refresh(); };
  $("#sheet").querySelectorAll("[data-pg]").forEach(b=> b.onclick = ()=>{ cot.pago = b.dataset.pg; if (cot.pago!=="efe") cot.desc5 = false;
    $("#sheet").querySelectorAll("[data-pg]").forEach(x=>x.classList.toggle("on", x===b));
    refresh(); });
  $("#cD5").onchange = e=>{ cot.desc5 = e.target.checked; refresh(); };
  $("#cMore").onclick = ()=>{ closeModal(); $("#q").focus(); };
  $("#cClear").onclick = ()=>{ if ($("#cClear").dataset.ok){ cot.items = []; cot.cliente = ""; cot.tel = ""; cot.desp = false; cot.pago = "efe"; cot.desc5 = false; saveCot(); render(); closeModal(); } else { $("#cClear").dataset.ok = 1; $("#cClear").textContent = "¿Seguro? Tocá de nuevo"; } };
  refresh();
  if (focusCode){ const i = cot.items.findIndex(x=>x.code===focusCode); const inp = $(`#sheet input[data-i="${i}"]`); if (inp) setTimeout(()=>inp.focus(),50); }
}
$("#list").addEventListener("click", e=>{
  const b = e.target.closest(".addq"); if (!b) return;
  const code = b.dataset.code;
  if (!inCot(code)){ cot.items.push({code, q:""}); saveCot(); render(); }
  openCot(code);
});
$("#cotBtn").onclick = ()=> openCot();

/* ===== Conexión con la base ===== */
async function loadStock(m){
  if (!m || !m.chunks){ rows=[]; buildProducts(); render(); return; }
  const snap = await db.collection("stock").get();
  const parts = snap.docs.map(d=>d.data()).filter(d=>d && d.v===m.v).sort((a,b)=>a.i-b.i);
  if (parts.length < m.chunks) return;
  rows = parts.flatMap(p=>{ try{return JSON.parse(p.items)}catch{return []} });
  buildProducts(); render();
}
function useEmbedded(){
  if (!EMB) return false;
  rows = EMB.rows; meta = {updatedAt: EMB.updatedAt, file: EMB.file};
  buildProducts(); renderMeta(); render(); updCotBtn(); renderNov(); return true;
}
(async ()=>{
  const hasEmb = useEmbedded();
  const timer = setTimeout(()=>{ if(!meta && !rows.length){ $("#upd").textContent="Sin conexión"; $("#list").innerHTML=`<div class="hint">No pude conectar con el stock todavía. Revisá la conexión.</div>`; } }, 10000);
  try{ db = await window.claude?.use("db"); }catch{ db = null; }
  if (!db){ clearTimeout(timer); if (!hasEmb){ $("#upd").textContent="Sin datos"; render(); } return; }
  try{
    const user = await window.claude?.use("user");
    if (user){ const c = await user.can?.("data.write"); canWrite = c===true; }
  }catch{ canWrite = false; }
  if (canWrite){ $("#upBtn").style.display="block"; if(!rows.length) render(); }
  let lastV = null;
  db.doc("meta/info").onSnapshot(async s=>{
    clearTimeout(timer);
    const m = s.exists ? s.data() : null;
    // solo usar la base si tiene un stock más nuevo que el publicado
    if (!m || m.ejemplo || (EMB && m.updatedAt <= EMB.updatedAt)) return;
    meta = m; renderMeta();
    if (m.v !== lastV){ lastV = m.v; try{ await loadStock(m); }catch(e){ console.log(e); } }
  }, err=>{ clearTimeout(timer); console.log(err); });
})();
render();
</script>
</body>
